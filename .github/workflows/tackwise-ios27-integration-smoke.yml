name: TackWise Xcode 27 integration smoke (#48 + #51)
on:
  push:
    branches:
      - integration/pr48-pr51-xcode27-20261105
permissions:
  contents: read
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Web tests and Capacitor sync
        run: |
          set -euo pipefail
          npm ci
          npm run test
          npm run cap:sync
      - name: Compile native iOS simulator app
        run: |
          set -euo pipefail
          xcodebuild -version
          mkdir -p ci-artifacts
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath "$RUNNER_TEMP/TackWiseDerived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/TackWisePackages" \
            CODE_SIGNING_ALLOWED=NO build > ci-artifacts/native-build.log 2>&1 || {
              tail -n 120 ci-artifacts/native-build.log
              exit 1
            }
          tail -n 20 ci-artifacts/native-build.log
      - name: Cold launch on iPhone 17 and iPhone 17e
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/TackWiseDerived/Build/Products/Debug-iphonesimulator/TackWise Race.app"
          test -d "$APP"
          for name in 'iPhone 17' 'iPhone 17e'; do
            DEVICE="$(xcrun simctl list devices available -j | jq -r --arg n "$name" '[.devices[][] | select(.name == $n)] | first | .udid // empty')"
            if [ -z "$DEVICE" ]; then
              echo "Missing simulator: $name"
              xcrun simctl list devices available
              exit 1
            fi
            SLUG="$(printf '%s' "$name" | tr ' ' '-')"
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl install "$DEVICE" "$APP"
            xcrun simctl privacy "$DEVICE" grant location com.anflyg.sailraceapp
            xcrun simctl launch "$DEVICE" com.anflyg.sailraceapp
            sleep 1
            xcrun simctl io "$DEVICE" screenshot "ci-artifacts/$SLUG-start.png"
            sleep 5
            xcrun simctl io "$DEVICE" screenshot "ci-artifacts/$SLUG-settled.png"
            xcrun simctl shutdown "$DEVICE"
          done
      - name: Save build log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tackwise-ios27-pr48-pr51
          path: ci-artifacts/
          retention-days: 3
