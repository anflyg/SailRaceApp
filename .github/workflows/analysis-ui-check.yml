name: Analysis UI check
on:
  push:
    branches: [ui/remove-synthetic-test-from-analysis]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm run build
